name: Coucou Mochi installers

on:
  push:
    branches: [build/coucou-mochi-installers]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mochi-installers-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  window-selection:
    name: Native Windows automatic edge attachment
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test real inactive, covered, minimized and closed windows
        run: cargo test --manifest-path tests/window-perch-native/Cargo.toml --locked -- --test-threads=1
  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        id: xcode-cache
        with:
          path: build/mochi-xcode
          key: mochi-xcode-${{ hashFiles('NotchBuddy/project.yml') }}-${{ github.sha }}
          restore-keys: mochi-xcode-${{ hashFiles('NotchBuddy/project.yml') }}-
      - run: brew install xcodegen
      - name: Build and verify DMG
        run: bash scripts/build-mochi-macos.sh
      - name: Keep native Mac build cache
        if: ${{ always() && steps.xcode-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/mochi-xcode
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Mochi-macOS-universal
          path: build/mochi-installers/macos/*
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows x64 EXE and MSI
    needs: window-selection
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: mochi-installers-windows-${{ hashFiles('windows/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mochi-installers-windows-${{ hashFiles('windows/Cargo.lock') }}-
            mochi-installers-windows-${{ hashFiles('windows/Cargo.lock') }}
            mochi-installers-windows-
      - name: Build and verify EXE and MSI
        shell: pwsh
        run: ./scripts/build-mochi-windows.ps1
      - name: Keep native build cache
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Mochi-Windows-x64
          path: |
            build/mochi-installers/windows/*.exe
            build/mochi-installers/windows/*.msi
            build/mochi-installers/windows/*.zip
            build/mochi-installers/windows/*.json
            build/mochi-installers/windows/*.txt
          if-no-files-found: error
          retention-days: 30
  installers:
    name: Both installer builds required
    if: ${{ always() }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$MACOS_RESULT" = success && test "$WINDOWS_RESULT" = success
